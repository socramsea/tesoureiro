[project]
name = "tesoureiro"
version = "0.1.0"
description = "Funcionário financeiro autônomo — agente de IA para o financeiro de PMEs"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
